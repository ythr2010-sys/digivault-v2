<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الطلب والدفع | الخزنة الرقمية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh;">
    <div style="width:100%; max-width:500px; background:var(--bg-card); border:1px solid var(--border-line); border-radius:16px; padding:30px;">
        <a href="index.html" style="color:var(--text-sub); text-decoration:none; font-size:0.85rem; display:inline-block; margin-bottom:15px;">← العودة للمتجر</a>
        <h1 style="font-size:1.4rem; color:var(--accent-cyan); margin-bottom:15px;">الدفع المحلي (BaridiMob / CCP) 💳</h1>
        <p style="color:var(--text-sub); font-size:0.9rem; margin-bottom:20px;">قم بالتحويل إلى الحساب التالي ثم أدخل رقم عملية الدفع:</p>
        
        <div style="background:#0e0e1a; padding:15px; border-radius:8px; border:1px solid var(--border-line); margin-bottom:20px; font-size:0.9rem;">
            <p><strong>CCP / BaridiMob:</strong> 00199999 55</p>
            <p style="margin-top:5px; color:var(--text-sub);">الاسم: DigiVault Platform</p>
        </div>

        <form id="orderForm" onsubmit="submitPaymentOrder(event)">
            <div class="form-group" style="margin-bottom:15px;">
                <label style="display:block; margin-bottom:6px; font-weight:bold;">رقم إيصال التحويل (Transaction ID / Ref)</label>
                <input type="text" id="paymentRef" required placeholder="مثال: 987654321">
            </div>
            <button type="submit" class="btn-primary" style="width:100%;" id="payBtn">تأكيد إرسال الطلب للأدمن</button>
        </form>
    </div>

    <script type="module">
        import { db, auth } from "./js/firebase-core.js";
        import { doc, getDoc, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const params = new URLSearchParams(location.search);
        const productId = params.get("id");
        let productData = null;

        async function initCheckout() {
            if(!productId) return;
            const snap = await getDoc(doc(db, "products", productId));
            if(snap.exists()) productData = snap.data();
        }
        initCheckout();

        window.submitPaymentOrder = async (e) => {
            e.preventDefault();
            const user = auth.currentUser;
            if(!user) { window.showToast("يجب تسجيل الدخول أولاً."); location.href="auth.html"; return; }
            if(!productData) return;

            const refCode = document.getElementById("paymentRef").value.trim();
            const btn = document.getElementById("payBtn");
            btn.disabled = true;

            try {
                await addDoc(collection(db, "orders"), {
                    customerEmail: user.email,
                    productId,
                    productTitle: productData.title,
                    price: productData.price,
                    paymentRef: refCode,
                    status: "pending_payment",
                    createdAt: serverTimestamp()
                });
                window.showToast("تم إرسال طلب الدفع للمراجعة بنجاح! سيتم إشعارك.");
                setTimeout(() => location.href="library.html", 1500);
            } catch(err) {
                window.showToast("حدث خطأ.");
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
