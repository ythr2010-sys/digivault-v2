<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبتي الرقمية | الخزنة الرقمية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page-wrapper">
        <aside class="sidebar">
            <div class="logo"><a href="index.html">الخزنة<span>الرقمية</span></a></div>
            <ul class="sidebar-menu">
                <li><a href="index.html">🏠 المتجر الرئيسي</a></li>
                <li><a href="library.html" class="active">📚 مكتبتي والتحميلات</a></li>
                <li><a href="upload.html">➕ رفع منتج جديد</a></li>
                <li><a href="contact.html">📩 تواصل معنا</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <h1 style="font-size:1.8rem; margin-bottom:20px;">مكتبتي الرقمية 📚</h1>
            <div id="libraryGrid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:20px;">
                <p style="color:var(--text-sub);">جاري تحميل مكتبتك...</p>
            </div>
        </main>
    </div>

    <script type="module">
        import { db, auth } from "./js/firebase-core.js";
        import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        onAuthStateChanged(auth, async (user) => {
            const grid = document.getElementById("libraryGrid");
            if (!user) {
                grid.innerHTML = `<p style="color:var(--text-sub)">يجب <a href="auth.html" style="color:var(--accent-cyan)">تسجيل الدخول</a> لعرض مكتبتك.</p>`;
                return;
            }
            try {
                const q = query(collection(db, "user_library"), where("userEmail", "==", user.email));
                const snap = await getDocs(q);
                if (snap.empty) {
                    grid.innerHTML = `<p style="color:var(--text-sub)">لم تقم باقتناء أي منتجات بعد. تصفح <a href="index.html" style="color:var(--accent-cyan)">المتجر</a>.</p>`;
                    return;
                }
                let html = "";
                snap.forEach(d => {
                    const item = d.data();
                    html += `
                        <div style="background:var(--bg-card); border:1px solid var(--border-line); border-radius:12px; padding:20px; display:flex; flex-direction:column; justify-content:space-between;">
                            <div>
                                <h3 style="color:#fff; margin-bottom:10px;">${item.title}</h3>
                                <p style="font-size:0.8rem; color:var(--text-sub);">جاهز للتحميل الآمن</p>
                            </div>
                            <div style="margin-top:20px; display:flex; gap:10px;">
                                <a href="${item.downloadUrl}" target="_blank" class="btn-primary" style="flex:1; text-decoration:none; text-align:center;">📥 تحميل الملف</a>
                            </div>
                        </div>
                    `;
                });
                grid.innerHTML = html;
            } catch(e) {
                grid.innerHTML = `<p style="color:var(--danger-red)">خطأ في تحميل المكتبة.</p>`;
            }
        });
    </script>
</body>
</html>
