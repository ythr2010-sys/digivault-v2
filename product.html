<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المنتج | الخزنة الرقمية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page-wrapper">
        <aside class="sidebar">
            <div class="logo"><a href="index.html">الخزنة<span>الرقمية</span></a></div>
            <ul class="sidebar-menu">
                <li><a href="index.html">🏠 المتجر الرئيسي</a></li>
                <li><a href="library.html">📚 مكتبتي والتحميلات</a></li>
                <li><a href="upload.html">➕ رفع منتج جديد</a></li>
                <li><a href="contact.html">📩 تواصل معنا</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <a href="index.html" style="color:var(--text-sub); text-decoration:none; display:inline-block; margin-bottom:20px;">← العودة للمتجر</a>
            <div id="productDetailContainer" style="background:var(--bg-card); border:1px solid var(--border-line); border-radius:16px; padding:25px; margin-bottom:30px;">
                <p style="color:var(--text-sub);">جاري تحميل تفاصيل المنتج...</p>
            </div>

            <div style="background:var(--bg-card); border:1px solid var(--border-line); border-radius:16px; padding:25px;">
                <h3 style="margin-bottom:15px; font-size:1.2rem;">أضف تقييمك وتعليقك ⭐</h3>
                <div style="display:flex; gap:10px; margin-bottom:15px;">
                    <select id="revStars" style="width:130px;">
                        <option value="5">⭐⭐⭐⭐⭐ ممتاز</option>
                        <option value="4">⭐⭐⭐⭐ جيد جداً</option>
                        <option value="3">⭐⭐⭐ متوسط</option>
                        <option value="2">⭐⭐ ضعيف</option>
                        <option value="1">⭐ سيء</option>
                    </select>
                </div>
                <textarea id="revText" placeholder="اكتب انطباعك عن الملف..." style="margin-bottom:15px;"></textarea>
                <button class="btn-primary" onclick="submitReview()">إرسال التقييم</button>
                <hr style="border-color:var(--border-line); margin:25px 0;">
                <h4 style="margin-bottom:15px;">آراء المستخدمين:</h4>
                <div id="reviewsList" style="display:flex; flex-direction:column; gap:12px;"></div>
            </div>
        </main>
    </div>

    <script type="module">
        import { db, auth } from "./js/firebase-core.js";
        import { doc, getDoc, collection, addDoc, getDocs, orderBy, query, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        let currentProductData = null;

        async function loadProduct() {
            if (!productId) {
                document.getElementById("productDetailContainer").innerHTML = `<p style="color:var(--danger-red)">لم يتم تحديد منتج.</p>`;
                return;
            }
            try {
                const docRef = doc(db, "products", productId);
                const snap = await getDoc(docRef);
                if (!snap.exists()) {
                    document.getElementById("productDetailContainer").innerHTML = `<p style="color:var(--danger-red)">المنتج غير موجود.</p>`;
                    return;
                }
                currentProductData = snap.data();
                const p = currentProductData;
                const isFree = (p.price === 'مجاني' || !p.price || p.price === '0');

                document.getElementById("productDetailContainer").innerHTML = `
                    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:25px; align-items:center;">
                        <div style="height:280px; border-radius:12px; overflow:hidden; background:#1b1b2d;">
                            <img src="${p.imageUrl || 'https://via.placeholder.com/400x300'}" style="width:100%; height:100%; object-fit:cover;">
                        </div>
                        <div>
                            <span style="font-size:0.8rem; background:rgba(0,210,255,0.15); color:var(--accent-cyan); padding:4px 10px; border-radius:6px; font-weight:bold;">${p.badge || 'رقمي'}</span>
                            <h1 style="font-size:1.8rem; margin:12px 0; color:#fff;">${p.title}</h1>
                            <p style="color:var(--text-sub); margin-bottom:20px; line-height:1.7;">${p.description}</p>
                            <div style="display:flex; align-items:center; gap:20px; flex-wrap:wrap;">
                                <span style="font-size:1.5rem; font-weight:900; color:var(--success-green);">${isFree ? 'مجاني' : '$' + p.price}</span>
                                <button class="btn-primary" onclick="acquireProduct()">
                                    ${isFree ? '📥 اقتناء وإضافة للمكتبة' : '💳 طلب الشراء والتحويل'}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                loadReviews();
            } catch(e) {
                console.error(e);
            }
        }

        window.acquireProduct = async () => {
            const user = auth.currentUser;
            if (!user) {
                window.showToast("يجب تسجيل الدخول أولاً لاقتناء المنتج!");
                setTimeout(() => location.href = "auth.html", 1200);
                return;
            }
            const isFree = (currentProductData.price === 'مجاني' || !currentProductData.price || currentProductData.price === '0');
            if (isFree) {
                try {
                    await setDoc(doc(db, "user_library", `${user.uid}_${productId}`), {
                        userEmail: user.email,
                        productId,
                        title: currentProductData.title,
                        downloadUrl: currentProductData.downloadUrl,
                        acquiredAt: new Date()
                    });
                    window.showToast("تمت إضافة المنتج لمكتبتك الرقمية بنجاح! 📚");
                    setTimeout(() => location.href = "library.html", 1500);
                } catch(e) {
                    window.showToast("حدث خطأ أثناء الاقتناء.");
                }
            } else {
                location.href = `checkout.html?id=${productId}`;
            }
        };

        window.submitReview = async () => {
            const user = auth.currentUser;
            if (!user) { window.showToast("سجل دخولك لكتابة تقييم."); return; }
            const stars = document.getElementById("revStars").value;
            const text = document.getElementById("revText").value.trim();
            if (!text) { window.showToast("اكتب تعليقاً أولاً."); return; }

            try {
                await addDoc(collection(db, "products", productId, "reviews"), {
                    userEmail: user.email,
                    stars: Number(stars),
                    text,
                    createdAt: new Date()
                });
                document.getElementById("revText").value = "";
                window.showToast("شكراً لتقييمك!");
                loadReviews();
            } catch(e) {
                window.showToast("خطأ في حفظ التقييم.");
            }
        };

        async function loadReviews() {
            try {
                const q = query(collection(db, "products", productId, "reviews"), orderBy("createdAt", "desc"));
                const snap = await getDocs(q);
                const list = document.getElementById("reviewsList");
                if (snap.empty) {
                    list.innerHTML = `<p style="color:var(--text-sub); font-size:0.85rem;">لا توجد تقييمات بعد.</p>`;
                    return;
                }
                let html = "";
                snap.forEach(d => {
                    const r = d.data();
                    html += `
                        <div style="background:#0e0e1a; padding:12px 14px; border-radius:8px; border:1px solid var(--border-line);">
                            <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:0.8rem;">
                                <strong style="color:var(--accent-cyan);">${r.userEmail}</strong>
                                <span>${'⭐'.repeat(r.stars)}</span>
                            </div>
                            <p style="font-size:0.9rem; color:var(--text-main);">${r.text}</p>
                        </div>
                    `;
                });
                list.innerHTML = html;
            } catch(e){}
        }

        loadProduct();
    </script>
</body>
</html>
